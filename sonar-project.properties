# Important configuration information for pipeline
sonar.organization=abraham089
sonar.projectKey=Abraham089_backend-workpal

# Path for checking
sonar.sources=src

# Path for tests
sonar.tests=tests

# Excluding tests of sonarqube checking and config files
sonar.coverage.exclusions=tests/**,src/backend_workpal/core/config.py,src/backend_workpal/core/security.py

# Path for report
sonar.python.coverage.reportPaths=coverage.xml