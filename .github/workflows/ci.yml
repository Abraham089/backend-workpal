name: CI

on:
  push:
    branches: 
      - main
      - dev
  # pull_request:
  #   types: [opened, synchronize, reopened]

jobs:
  SonarQube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  Dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install poetry
          poetry install
          poetry run pip-audit

