name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    types: [opened, synchronize, reopened]

env:
  ALGORITHM: ${{ vars.ALGORITHM }}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${{ vars.ACCESS_TOKEN_EXPIRE_MINUTES}}

jobs:
  SonarQube:
    runs-on: ubuntu-latest
    environment: development
    env:
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      FRONTEND_IP_URL: ${{ vars.FRONTEND_IP_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry and Dependencies
        env:
          POETRY_INSTALLER_ONLY_BINARY: ":all:"
        run: |
          pip install --only-binary :all: "poetry==2.4.1"
          poetry install --sync
      - name: Run Tests with Coverage
        run: |
          poetry run pytest --cov=src/backend_workpal --cov-report=xml:coverage.xml
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@b632445a46f521460d97cad21057b904b24c326f
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  Dependencies:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry and Dependencies
        env:
          POETRY_INSTALLER_ONLY_BINARY: ":all:"
        run: |
          pip install --only-binary :all: "poetry==2.4.1"
          poetry install --sync --no-root
          poetry run pip-audit

  Build-and-push-image:
    runs-on: ubuntu-latest
    if: contains(fromJSON('["main", "dev"]'), github.ref_name) && github.event_name == 'push'
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      ENVIRONMENT_NAME: ${{ vars.ENVIRONMENT_NAME }}
    needs:
      - Dependencies
      - SonarQube
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.ENVIRONMENT_NAME }}-${{ github.run_number }}
            type=raw,value=${{ env.ENVIRONMENT_NAME }}-latest
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
