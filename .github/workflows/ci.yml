name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - "releases/**"
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  SonarQube:
    runs-on: ubuntu-latest
    env:
      FRONTEND_URL: "http://localhost:5173"
      FRONTEND_IP_URL: "http://127.0.0.1:5173"
      FRONTEND_DOCKER_URL: "http://frontend:5173"
      SECRET_KEY: "ci-secret-key"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry and Dependencies
        env:
          POETRY_INSTALLER_ONLY_BINARY: ":all:"
        run: |
          pip install --only-binary :all: "poetry==2.4.1"
          poetry install --sync
      - name: Run Tests with Coverage
        run: |
          poetry run pytest --cov=src/backend_workpal --cov-report=xml:coverage.xml
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@b632445a46f521460d97cad21057b904b24c326f
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  Dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry and Dependencies
        env:
          POETRY_INSTALLER_ONLY_BINARY: ":all:"
        run: |
          pip install --only-binary :all: "poetry==2.4.1"
          poetry install --sync --no-root
          poetry run pip-audit
