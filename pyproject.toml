[project]
name = "backend-workpal"
version = "0.1.0"
description = ""
authors = [
    {name = "Abraham",email = "abrahamgb274@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12, <4.0"
dependencies = [
    "pip-audit (>=2.10.1,<3.0.0)",
    "sqlmodel (>=0.0.48,<0.0.49)",
    "fastapi[standard] (>=0.161.1,<0.162.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pwdlib (>=0.3.1,<0.4.0)",
    "jwt (>=1.4.0,<2.0.0)"
]

[tool.poetry]
packages = [{include = "backend_workpal", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
